name: Playwright Regression Tests

on:
  workflow_dispatch:
    inputs:
      slack_channel:
        description: 'Slack channel ID for notifications'
        required: true
      slack_ts:
        description: 'Slack message timestamp for updates'
        required: true
      trigger_source:
        description: 'Source that triggered the workflow'
        required: false
        default: 'manual'
      test_group:
        description: 'Test group to run (YesSetUp, NoSetUp, or all)'
        required: false
        default: 'all'

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: lts
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        
      - name: Update Slack - Running tests
        uses: slackapi/slack-github-action@v1.24.0
        with:
          update-ts: ${{ github.event.inputs.slack_ts }}
          channel-id: ${{ github.event.inputs.slack_channel }}
          payload: |
            {
              "text": "🏃‍♂️ Regression tests in progress...\nTest group: ${{ github.event.inputs.test_group }}\nRepository: ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🏃‍♂️ *Regression tests in progress*\nTest group: `${{ github.event.inputs.test_group }}`\nRepository: `${{ github.repository }}`\nBranch: `${{ github.ref_name }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run details>"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          
      - name: Run Playwright tests
        id: run_tests
        run: |
          if [ "${{ github.event.inputs.test_group }}" = "YesSetUp" ]; then
            npm run test:setup
            npx playwright test --project="KB Regression YesSetUp" --reporter=list,html
          elif [ "${{ github.event.inputs.test_group }}" = "NoSetUp" ]; then
            npx playwright test --project="KB Regression NoSetUp" --reporter=list,html
          else
            npm run test:setup
            npx playwright test --reporter=list
          fi
        continue-on-error: true
        
      - name: Upload test report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          
      - name: Update Slack - Test results
        uses: slackapi/slack-github-action@v1.24.0
        if: always()
        with:
          update-ts: ${{ github.event.inputs.slack_ts }}
          channel-id: ${{ github.event.inputs.slack_channel }}
          payload: |
            {
              "text": "${{ steps.run_tests.outcome == 'success' && '✅ Regression tests passed!' || '❌ Regression tests failed!' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.run_tests.outcome == 'success' && '✅ *Regression tests passed!*' || '❌ *Regression tests failed!*' }}\nTest group: `${{ github.event.inputs.test_group }}`\nRepository: `${{ github.repository }}`\nBranch: `${{ github.ref_name }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View full test results>"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
