name: Playwright Regression Tests

on:
  workflow_dispatch:
    inputs:
      slack_channel:
        description: 'Slack channel ID for notifications'
        required: true
        default: 'none'
      slack_ts:
        description: 'Slack message timestamp for updates'
        required: true
        default: 'none'
      trigger_source:
        description: 'Source that triggered the workflow'
        required: false
        default: 'manual'
      test_group:
        description: 'Optional parameter (not used in current configuration)'
        required: false
        default: ''

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: lts
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        
      # Only update Slack if it's a Slack-triggered run
      - name: Update Slack - Running tests
        if: ${{ github.event.inputs.trigger_source == 'slack' && github.event.inputs.slack_channel != 'none' }}
        uses: slackapi/slack-github-action@v1.24.0
        with:
          update-ts: ${{ github.event.inputs.slack_ts }}
          channel-id: ${{ github.event.inputs.slack_channel }}
          payload: |
            {
              "text": "🏃‍♂️ Regression tests in progress...\nTest group: ${{ github.event.inputs.test_group }}"
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          
      - name: Run Playwright tests
        id: run_tests
        run: |
          # Always run setup
          npm run test:setup
          
          # Run all tests
          echo "Running all tests"
          npx playwright test --reporter=list,html
        continue-on-error: true
        
      - name: Upload test report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          
      # Only update Slack with results if it's a Slack-triggered run
      - name: Update Slack - Test results
        if: ${{ always() && github.event.inputs.trigger_source == 'slack' && github.event.inputs.slack_channel != 'none' }}
        uses: slackapi/slack-github-action@v1.24.0
        with:
          update-ts: ${{ github.event.inputs.slack_ts }}
          channel-id: ${{ github.event.inputs.slack_channel }}
          payload: |
            {
              "text": "${{ steps.run_tests.outcome == 'success' && '✅ Regression tests passed!' || '❌ Regression tests failed!' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.run_tests.outcome == 'success' && '✅ *Regression tests passed!*' || '❌ *Regression tests failed!*' }}\nTest group: `${{ github.event.inputs.test_group }}`\nRepository: `${{ github.repository }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View full test results>"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
